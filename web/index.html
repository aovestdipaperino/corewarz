<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoreWarz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CoreWarz</h1>
    <div class="controls">
      <button id="load" title="Assemble the warriors and start a new battle">Load</button>
      <button id="play" title="Run or pause (space)" disabled>Run</button>
      <button id="step" title="Execute one cycle (s)" disabled>Step</button>
      <label class="speed">Speed
        <input id="speed" type="range" min="0" max="7" value="4">
        <output id="speed-label"></output>
      </label>
    </div>
  </header>

  <main>
    <section class="arena">
      <canvas id="core" aria-label="Core memory"></canvas>
      <div id="status" class="status">Loading WebAssembly…</div>
      <div id="inspect" class="inspect">Hover over the core to inspect a cell.</div>
      <table id="scoreboard" class="scoreboard"></table>
    </section>

    <aside class="setup">
      <div id="warriors"></div>
      <button id="add-warrior">Add warrior</button>
      <fieldset class="settings">
        <legend>Battle</legend>
        <label>Core size <input id="core-size" type="number" min="100" max="100000" value="8000"></label>
        <label>Cycle limit <input id="max-cycles" type="number" min="1" value="80000"></label>
        <label>Seed <input id="seed" type="number" min="0" value="0"></label>
        <label class="check"><input id="extended" type="checkbox"> Extended dialect</label>
      </fieldset>
      <p id="error" class="error" role="alert"></p>
    </aside>
  </main>

  <template id="warrior-template">
    <div class="warrior">
      <div class="warrior-head">
        <span class="swatch"></span>
        <select class="sample" aria-label="Sample warrior"></select>
        <button class="remove" title="Remove this warrior">✕</button>
      </div>
      <textarea class="source" spellcheck="false" rows="8" aria-label="Redcode source"></textarea>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
